<nav class="bottom-nav">
    @for (item of items(); track $index) {
    <a 
    [routerLink]="item.route" 
    routerLinkActive="active" 
    class="bottom-nav-item"
    >
        <img [src]="item.icon" alt="{{item.label}}" class="bottom-nav-icon" />
        <small>{{ item.label }}</small>
    </a>
    }
</nav>
