<aside class="sidenav" [class.open]="isOpen" (click)="$event.stopPropagation()">
  <div class="sidenav-header">
    <span class="sidenav-title">{{title}}</span>
  </div>

  <nav class="sidenav-links">
    <ul>
      @for (route of routes; track $index) {
      <li>
        <a [routerLink]="route?.path" (click)="close()"  [ngClass]="{ 'clickable': route?.path }"  routerLinkActive="active">{{ route?.label }}</a>
        @if(route.children?.length) {
        <ul class="submenu">
          @for (child of route.children; track $index) {
          <li>
            <a [routerLink]="child?.path" (click)="close()" [ngClass]="{ 'clickable': child?.path }" routerLinkActive="active">{{ child?.label }}</a>
          </li>
          }
        </ul>
        }
      </li>
      }
    </ul>
  </nav>

  <div class="sidenav-actions">
    <ng-content></ng-content>
  </div>
</aside>

@if(isOpen) {
<div class="sidenav-overlay" (click)="close()"></div>
}
